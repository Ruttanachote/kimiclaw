version: '3.8'

services:
  # AI Proxy Service - จัดการ API Keys หลาย account
  ai-proxy:
    build:
      context: ../ai-proxy
      dockerfile: Dockerfile
    container_name: ai-devstudio-proxy
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-devstudio}
      - DB_PASSWORD=${DB_PASSWORD:-devstudio123}
      - DB_NAME=${DB_NAME:-devstudio}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    ports:
      - "3001:3001"
    volumes:
      - ../ai-proxy/keys:/app/keys
    depends_on:
      - redis
      - postgres
    networks:
      - ai-devstudio

  nginx:
    image: nginx:alpine
    container_name: ai-devstudio-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../web/dist:/usr/share/nginx/html:ro
    depends_on:
      - api-gateway
      - ai-proxy
      - n8n
    networks:
      - ai-devstudio

  # ... rest of services same as before
  n8n:
    image: n8nio/n8n:latest
    container_name: ai-devstudio-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-admin123}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${DB_NAME:-devstudio}
      - DB_POSTGRESDB_USER=${DB_USER:-devstudio}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD:-devstudio123}
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      - postgres
    networks:
      - ai-devstudio

  api-gateway:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: ai-devstudio-api
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-devstudio}
      - DB_PASSWORD=${DB_PASSWORD:-devstudio123}
      - DB_NAME=${DB_NAME:-devstudio}
      - AI_PROXY_URL=http://ai-proxy:3001
      - USE_AI_PROXY=true
      - JWT_SECRET=${JWT_SECRET}
      - N8N_URL=http://n8n:5678
    ports:
      - "3000:3000"
    volumes:
      - ../shared/outputs:/app/outputs
      - ../shared/projects:/app/projects
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
      - postgres
      - ai-proxy
    networks:
      - ai-devstudio

  # ... rest of agents same as before

  redis:
    image: redis:7-alpine
    container_name: ai-devstudio-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ai-devstudio
    command: redis-server --appendonly yes

  postgres:
    image: postgres:16-alpine
    container_name: ai-devstudio-postgres
    environment:
      - POSTGRES_USER=${DB_USER:-devstudio}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-devstudio123}
      - POSTGRES_DB=${DB_NAME:-devstudio}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d
    networks:
      - ai-devstudio

volumes:
  redis-data:
  postgres-data:
  n8n-data:

networks:
  ai-devstudio:
    driver: bridge
