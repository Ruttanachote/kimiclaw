<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI DevStudio v5.1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 1.25rem;
      color: #94a3b8;
      margin-bottom: 2rem;
    }
    .stats {
      display: flex;
      gap: 2rem;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .stat {
      text-align: center;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: bold;
      color: #6366f1;
    }
    .stat-label {
      font-size: 0.875rem;
      color: #64748b;
    }
    .btn {
      display: inline-block;
      padding: 1rem 2rem;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .agents {
      margin-top: 3rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .agent {
      background: rgba(255,255,255,0.1);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 AI DevStudio</h1>
    <p class="subtitle">Build software with your AI team</p>
    
    <div class="stats">
      <div class="stat">
        <div class="stat-value">12</div>
        <div class="stat-label">AI Agents</div>
      </div>
      <div class="stat">
        <div class="stat-value">7</div>
        <div class="stat-label">AI Providers</div>
      </div>
      <div class="stat">
        <div class="stat-value">2h</div>
        <div class="stat-label">Avg. Project Time</div>
      </div>
    </div>
    
    <a href="dashboard.html" class="btn">Get Started</a>
    
    <div class="agents">
      <span class="agent">💬 Secretary</span>
      <span class="agent">🎨 UI/UX</span>
      <span class="agent">⚛️ Frontend</span>
      <span class="agent">🔧 Backend</span>
      <span class="agent">🧪 QA</span>
      <span class="agent">🎬 Video</span>
      <span class="agent">📱 Social</span>
    </div>
    
    <p style="margin-top: 3rem; color: #64748b; font-size: 0.875rem;">
      v5.1 - All systems operational
    </p>
  </div>
</body>
</html>
